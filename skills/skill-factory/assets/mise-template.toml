# Task graph for this skill.
# One default path per job. Local runs and remote CI both call: mise run ci

min_version = "2026.9.0"

[settings]
experimental = true
jobs = 4

[tools]
node = "24.18.0"
python = "3.13.14"
uv = "0.11.29"
shfmt = "3.14.1"

[env]
PYTHONDONTWRITEBYTECODE = "1"
PYTHONHASHSEED = "0"
UV_PYTHON = "3.13.14"
MASTRA_TELEMETRY_DISABLED = "1"

[task_config]
dir = "{{config_root}}"

[tasks.ci]
usage = "flag \"--human-context <file>\" required=#true\nflag \"--human-context-sha256 <sha>\" required=#true"
description = "Full pipeline: tests, structure, writing, code, evals, improvement policy"
alias = "c"
output = "prefix"
depends = ["test", "validate", "lint-writing", "lint-placeholders", {"task" = "evals", "args" = ["--human-context", "{{usage.human_context}}", "--human-context-sha256", "{{usage.human_context_sha256}}"]}, "improvement-policy", {"task" = "decision-policy", "args" = ["--human-context", "{{usage.human_context}}", "--human-context-sha256", "{{usage.human_context_sha256}}"]}]

[tasks.info]
description = "Report this skill's name and trigger description"
depends = []
run = "python3 scripts/skill_info.py"

[tasks.human-matrix]
description = "Resolve versioned human-study and work inventories and one explicit selection"
depends = ["runtime-install"]
run = "node scripts/human-matrix-workflow.ts"

[tasks.test]
description = "Every test in scripts/tests/"
depends = ["test-native"]
run = "uv run --with PyYAML==6.0.3 python -m unittest discover -s scripts/tests -p 'test_*.py' -v"
run_windows = "uv run --with PyYAML==6.0.3 python -m unittest discover -s scripts/tests -p 'test_*.py' -v"
timeout = "180s"

[tasks.validate]
description = "Static structure checks against the generation contract"
depends = []
run = "uv run --with PyYAML==6.0.3 scripts/validate_skill.py . --accept"

[tasks.lint-writing]
description = "Mechanical writing checks on every markdown file"
depends = []
run = "python3 scripts/lint_writing.py ."

[tasks.lint-code]
description = "Size and nesting limits on every code file"
depends = ["runtime-install"]
run = "uv run --with PyYAML==6.0.3 python scripts/check_code_rules.py ."

[tasks.runtime-install]
description = "Install this skill's frozen workflow and compiler dependencies without lifecycle scripts"
depends = []
run = "npm ci --ignore-scripts --no-fund 1>&2"

[tasks.typecheck-native]
description = "Type-check this skill's native code against its pinned SDK"
depends = ["lint-code"]
run = "npm exec --offline -- tsc --noEmit"

[tasks.test-native]
description = "Exercise this skill's native tests and selected engine failure and recovery probes"
depends = ["typecheck-native"]
run = "node --test scripts/tests/*.test.ts"

[tasks.lint-placeholders]
description = "Refuse any scaffold placeholder text left in markdown or evals"
depends = []
run = "python3 scripts/check_placeholders.py ."

[tasks.evals]
usage = "flag \"--human-context <file>\" required=#true\nflag \"--human-context-sha256 <sha>\" required=#true\nflag \"--min-cases <value>\" default=\"4\"\nflag \"--min-queries <value>\" default=\"4\""
description = "Schema checks on evals/evals.json and evals/trigger-queries.json"
depends = []
run = "python3 scripts/check_evals.py . --human-context \"$usage_human_context\" --human-context-sha256 \"$usage_human_context_sha256\" --min-cases \"$usage_min_cases\" --min-queries \"$usage_min_queries\""

[tasks.improvement-policy]
description = "Validate the optional nonregressing skill-improvement policy"
depends = []
run = "python3 scripts/check_improvement_contract.py ."

[tasks.use-case-policy]
usage = "flag \"--human-context <file>\" required=#true\nflag \"--human-context-sha256 <sha>\" required=#true\nflag \"--inspect-legacy\"\nflag \"--source <value>\" default=\"\"\nflag \"--coverage <value>\" default=\"\"\nflag \"--source-sha256 <value>\" default=\"\"\nflag \"--coverage-sha256 <value>\" default=\"\""
description = "Reject generic skill primitives without a domain-specific role and proof"
depends = [{"task" = "domain-research-policy", "args" = ["--human-context", "{{usage.human_context}}", "--human-context-sha256", "{{usage.human_context_sha256}}"]}]
run = "set --\nif [ \"${usage_inspect_legacy:-false}\" = \"true\" ]; then set -- --inspect-legacy; fi\npython3 scripts/check_use_case_contract.py . --human-context \"$usage_human_context\" --human-context-sha256 \"$usage_human_context_sha256\" --source \"$usage_source\" --coverage \"$usage_coverage\" --source-sha256 \"$usage_source_sha256\" --coverage-sha256 \"$usage_coverage_sha256\" \"$@\""

[tasks.mise-primitives-policy]
usage = "flag \"--human-context <file>\" required=#true\nflag \"--human-context-sha256 <sha>\" required=#true"
description = "Validate every official Mise primitive disposition for this skill"
depends = [{"task" = "use-case-policy", "args" = ["--human-context", "{{usage.human_context}}", "--human-context-sha256", "{{usage.human_context_sha256}}"]}]
run = "python3 scripts/check_mise_primitives.py ."

[tasks.primitive-lifecycle-policy]
usage = "flag \"--human-context <file>\" required=#true\nflag \"--human-context-sha256 <sha>\" required=#true"
description = "Validate every domain aspect and skill primitive lifecycle owner"
depends = [{"task" = "mise-primitives-policy", "args" = ["--human-context", "{{usage.human_context}}", "--human-context-sha256", "{{usage.human_context_sha256}}"]}]
run = "python3 scripts/check_primitive_lifecycle.py ."

[tasks.task-graph-policy]
usage = "flag \"--human-context <file>\" required=#true\nflag \"--human-context-sha256 <sha>\" required=#true"
description = "Reject generic, disconnected, circular, or alternate Mise dependency paths"
depends = [{"task" = "primitive-lifecycle-policy", "args" = ["--human-context", "{{usage.human_context}}", "--human-context-sha256", "{{usage.human_context_sha256}}"]}]
run = "python3 scripts/check_task_graph.py ."

[tasks.domain-research-policy]
usage = "flag \"--human-context <file>\" required=#true\nflag \"--human-context-sha256 <sha>\" required=#true"
description = "Validate source-backed domain research coverage and receipts"
depends = []
run = "python3 scripts/check_domain_research.py . --human-context \"$usage_human_context\" --human-context-sha256 \"$usage_human_context_sha256\""

[tasks.decision-policy]
usage = "flag \"--human-context <file>\" required=#true\nflag \"--human-context-sha256 <sha>\" required=#true"
description = "Validate motivated deterministic and model-owned skill decisions"
depends = [{"task" = "task-graph-policy", "args" = ["--human-context", "{{usage.human_context}}", "--human-context-sha256", "{{usage.human_context_sha256}}"]}]
run = "python3 scripts/check_decision_records.py . --human-context \"$usage_human_context\" --human-context-sha256 \"$usage_human_context_sha256\""

[tasks.invocation-policy]
description = "Check task accounting and host-bound evidence; pass receipt and bindings after --"
depends = []
run = "uv run --with PyYAML==6.0.3 python scripts/check_invocation_receipt.py ."

[tasks.agentic-request]
description = "Validate and dispatch one typed {{NAME}} agentic request to a configured runner"
depends = []
run = "python3 scripts/run_agentic_request.py"
run_windows = "python scripts/run_agentic_request.py"

[tasks.mise-latest]
description = "Install the latest stable Mise after this skill invocation concludes"
depends = []
run = "mise self-update --yes --no-plugins"

[tasks.mise-primitives-update]
usage = "flag \"--human-context <file>\" required=#true\nflag \"--human-context-sha256 <sha>\" required=#true"
description = "Refresh this skill's official Mise primitive catalog after self-update"
depends = ["mise-latest"]
depends_post = [{"task" = "mise-primitives-policy", "args" = ["--human-context", "{{usage.human_context}}", "--human-context-sha256", "{{usage.human_context_sha256}}"]}]
run = "python3 scripts/sync_mise_primitives.py ."
run_windows = "python scripts/sync_mise_primitives.py ."
timeout = "60s"
