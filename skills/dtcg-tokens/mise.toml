# Task graph for this skill.
# One default path per job. Local runs and remote CI both call: mise run ci

[tasks.ci]
description = "Full pipeline: tests, token checks, artifact boundaries, package checks"
run = [
  "mise run test",
  "mise run validate-dtcg",
  "mise run artifact-contract",
  "mise run validate",
  "mise run lint-writing",
  "mise run lint-code",
  "mise run lint-placeholders",
  "mise run evals",
]

[tasks.validate-dtcg]
description = "Validate the example token file against the DTCG gate"
run = "PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate_dtcg.py evals/files/sample.tokens.json"

[tasks.artifact-contract]
description = "Block bundled visual generators and require negative precedent evals"
run = "PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_artifact_contract.py ."

[tasks.test]
description = "Every test in scripts/tests/"
run = "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v"

[tasks.validate]
description = "Static structure checks against the generation contract"
run = "PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate_skill.py ."

[tasks.lint-writing]
description = "Mechanical writing checks on every markdown file"
run = "PYTHONDONTWRITEBYTECODE=1 python3 scripts/lint_writing.py ."

[tasks.lint-code]
description = "Size and nesting limits on every code file"
run = "PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_code_rules.py ."

[tasks.lint-placeholders]
description = "Refuse any scaffold placeholder text left in markdown or evals"
run = "PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_placeholders.py ."

[tasks.evals]
description = "Schema checks on evals/evals.json and evals/trigger-queries.json"
run = "PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_evals.py ."
