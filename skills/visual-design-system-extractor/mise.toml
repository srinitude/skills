# Task graph for this skill.
# Local runs and remote CI both call: mise run ci

[tools]
python = "3.13.14"
uv = "0.11.29"

[tasks.ci]
description = "Full pipeline: all tests, structure, writing, code, evals"
depends = ["test", "validate", "lint-writing", "lint-code", "evals", "decision-policy"]

[tasks.test]
description = "Every test in scripts/tests/, including live font catalog checks"
run = "PYTHONDONTWRITEBYTECODE=1 uv run --no-project --with 'PyYAML>=6,<7' python -m unittest discover -s scripts/tests -p 'test_*.py' -v"
depends = []

[tasks.validate]
description = "Static structure checks against the generation contract"
run = "python3 scripts/validate_skill.py ."
depends = []

[tasks.lint-writing]
description = "Mechanical writing checks on every markdown file"
run = "python3 scripts/lint_writing.py ."
depends = []

[tasks.lint-code]
description = "Size and nesting limits on every code file"
run = "python3 scripts/check_code_rules.py ."
depends = []

[tasks.evals]
description = "Schema checks on evals/evals.json and evals/trigger-queries.json"
run = "python3 scripts/check_evals.py ."
depends = []

[tasks.domain-research-policy]
description = "Validate current domain research receipts"
run = "python3 scripts/check_domain_research.py ."
depends = []

[tasks.use-case-policy]
description = "Validate domain-specific owners"
run = "python3 scripts/check_use_case_contract.py ."
depends = ["domain-research-policy"]

[tasks.mise-primitives-policy]
description = "Validate Mise primitive use"
run = "python3 scripts/check_mise_primitives.py ."
depends = ["use-case-policy"]

[tasks.primitive-lifecycle-policy]
description = "Validate lifecycle ownership"
run = "python3 scripts/check_primitive_lifecycle.py ."
depends = ["mise-primitives-policy"]

[tasks.task-graph-policy]
description = "Validate the Mise task graph"
run = "python3 scripts/check_task_graph.py ."
depends = ["primitive-lifecycle-policy"]

[tasks.decision-policy]
description = "Validate motivated decisions"
run = "python3 scripts/check_decision_records.py ."
depends = ["task-graph-policy"]

[tasks.improvement-policy]
description = "Validate nonregressing improvement trials"
run = "python3 scripts/check_improvement_contract.py ."
depends = []

[tasks.invocation-policy]
description = "Validate one task-accounting receipt"
run = "python3 scripts/check_invocation_receipt.py ."
depends = []

[tasks.agentic-request]
description = "Dispatch one typed model-owned request"
run = "python3 scripts/run_agentic_request.py"
depends = []

[tasks.mise-latest]
description = "Update Mise after accepted work"
run = "mise self-update --yes --no-plugins"
depends = []

[tasks.mise-primitives-update]
description = "Refresh the Mise primitive catalog"
run = "python3 scripts/sync_mise_primitives.py ."
depends = ["mise-latest"]

[tasks.font-catalog]
description = "Read the live Google Fonts catalog for visual token extraction"
run = "uv run --with PyYAML==6.0.3 python scripts/rare_google_fonts.py catalog"
depends = []

[tasks.font-discover]
description = "Rank live type candidates for visual token extraction"
run = "uv run --with PyYAML==6.0.3 python scripts/rare_google_fonts.py discover"
depends = []

[tasks.font-verify]
description = "Verify selected type families for visual token extraction"
run = "uv run --with PyYAML==6.0.3 python scripts/rare_google_fonts.py verify"
depends = []

[tasks.font-set]
description = "Choose a fitted type set for visual token extraction"
run = "uv run --with PyYAML==6.0.3 python scripts/rare_google_fonts.py set"
depends = []

[tasks.font-fit]
description = "Run the visual token extraction font-fit operation"
run = "python3 scripts/font_fit.py"
depends = []

[tasks.font-rules]
description = "Run the visual token extraction font-rules operation"
run = "python3 scripts/font_rules.py"
depends = []

[tasks.render-preview]
description = "Run the visual token extraction render-preview operation"
run = "python3 scripts/render_preview.py"
depends = []

[tasks.schema-tools]
description = "Run the visual token extraction schema-tools operation"
run = "python3 scripts/schema_tools.py"
depends = []

[tasks.screenshot-preview]
description = "Run the visual token extraction screenshot-preview operation"
run = "python3 scripts/screenshot_preview.py"
depends = []

[tasks.tests-test-font-rules]
description = "Run the visual token extraction tests-test-font-rules operation"
run = "python3 scripts/tests/test_font_rules.py"
depends = []

[tasks.validate-design-system-yaml]
description = "Run the visual token extraction validate-design-system-yaml operation"
run = "python3 scripts/validate_design_system_yaml.py"
depends = []

[tasks.font-record]
description = "Read one saved visual token extraction font record"
run = "python3 -c \"import json,sys;d=json.load(open(sys.argv[1]));print([(c['family'],c['rarity_percentile']) for c in d['chosen']]);print(d['vetoes']);print(d['pairing']['passes'])\""
depends = []
