["rule:outcome"]
description = '''
# `rule:outcome`

## Why this runs

Preserve the complete portable skill contract.

## When to run

On load and before choosing or changing a skill outcome.
This rule binds this factory and every skill it creates or updates.

## Inputs

Read [SKILL.md](../SKILL.md), the current request and the sources named below.
Use the same bound request and private state as `rule:context`.
Include the exact relevant files and prior evidence in the request context.
A dependency pass proves its checked scope, not all skill acceptance.


## Work

Build portable skills that follow the [Agent Skills specification](https://agentskills.io/specification).

Package their instructions and support files together, and state their tool and runtime needs.

Update and maintain them.

They must do their stated job in real use.

This whole contract binds skill-factory.

It also binds every skill the factory creates or updates.

It binds skills the factory standardizes or imports.

It binds skills the factory adapts or refreshes.

It binds skills the factory invokes, checks or maintains.

Cover all their files and outputs.

Keep each skill's purpose.

Keep accepted behavior and source bytes.

Keep approved scope, independent variants and lineage.

Leave unrelated work intact.

Each required rule that applies must pass.

A passed part cannot offset a missing required capability or proof.

Nor can an average.

Read the full workflow output. Use the model's own tools and judgment.
Code checks facts that can be tested; required human work stays with its owner.
Do not run this task or its dependents from inside this work unit.
Missing inputs or proof keep the affected result pending.
Correct the input or obtain the required proof before retrying.

## Proof

Return reasons, source locations, actual evidence and remaining limits.
Keep the reply bound to this task and its exact inputs.
Resume this same task through Mise using the `rule:context` reply contract.
A workflow pass checks bindings; it cannot prove meaning or human acceptance.
'''
env = { UV_PYTHON = "{{tools.python.path}}" }
depends = ["rule:context"]
run = "node scripts/run_rule.ts rule:outcome"

