## Work

Before affected writes, resolve scope and audience through `mise run resolve-scope`, `mise run use-case-policy` and the [scope contract](../references/skill-scope-contract.md). `metadata.scope` must be one string: `user` for user-wide use or `project` for one project.

The [use-case record](../assets/use-case-contract.json) sets `audience.primary` to `human` or `agent`.

This factory serves agents first and humans second.

Use that record to label the early body and operation reports.

Scope, executor, report recipient and location do not set audience.

Keep valid choices unless an allowed change or a resolved purpose conflict requires a change.

Reject bad values, types and duplicate keys.

Untouched legacy inspection may allow a missing field; acceptance of a changed output may not.

Resolve missing scope from clear intended use and authoritative context.

Resolve primary audience from an explicit choice or authoritative purpose.

If either remains unclear, ask one concise question before the affected write.

Scope grants no right to install, move, copy or use a resource.

Verify any allowed destination with the host integration owner.

Record secondary and staged output audiences where they change requirements.

Derive the role key in [Outcome](../SKILL.md#outcome) from the audience and ownership records.

Use its meanings across the package and reports; do not copy the full key into each file.

Read the full workflow output. Use the model's own tools and judgment.
Code checks facts that can be tested; required human work stays with its owner.
Do not run this task or its dependents from inside this work unit.
