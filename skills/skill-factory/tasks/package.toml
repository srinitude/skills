# `rule:package-shape`

## Why this runs

Keep valid package metadata and required files.

## When to run

When creating, updating or accepting a skill package or its metadata.
This rule binds this factory and every skill it creates or updates.

## Inputs

Read [SKILL.md](../SKILL.md), the current request and the sources named below.
Use the same bound request and private state as `rule:context`.
Include the exact relevant files and prior evidence in the request context.
A dependency pass proves its checked scope, not all skill acceptance.


## Work

- Each accepted skill owns one matching directory, [SKILL.md](../SKILL.md), necessary support, `mise.toml`, CI, complete examples and evals.

YAML starts at byte zero with supported fields only: name, description, license, compatibility, metadata and allowed-tools.

Reject duplicate keys and invalid types.

Registry names match the directory and contain 1 to 64 lowercase letters/digits with single hyphens; non-registry names retain `^[a-z0-9][a-z0-9._-]*$`.

Descriptions are quoted, nonempty, at most 1024 characters, start with `Use when` and describe applicability.

MIT is the default license.

Metadata values are strings; author is Kiren Srinivasan; new independent versions start at `"0.1.0"`.

Preserve valid metadata.

Optional compatibility is 1 to 500 characters; allowed-tools retains supported string semantics.

Read the full workflow output. Use the model's own tools and judgment.
Code checks facts that can be tested; required human work stays with its owner.
Do not run this task or its dependents from inside this work unit.
Missing inputs or proof keep the affected result pending.
Correct the input or obtain the required proof before retrying.

## Proof

Return reasons, source locations, actual evidence and remaining limits.
Keep the reply bound to this task and its exact inputs.
Resume this same task through Mise using the `rule:context` reply contract.
A workflow pass checks bindings; it cannot prove meaning or human acceptance.
'''
env = { UV_PYTHON = "{{tools.python.path}}" }
depends = ["rule:context"]
run = "node scripts/run_rule.ts rule:package-shape"

