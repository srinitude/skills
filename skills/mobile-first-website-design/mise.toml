[tools]
python = "3.12"

[tasks.test]
description = "Run the mobile-first package tests"
run = "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -v"

[tasks.validate]
description = "Validate prompt corpus, fixtures, and source mapping"
run = "python3 scripts/check_package.py"

[tasks.evals]
description = "Validate behavior and trigger eval registries"
run = "python3 scripts/check_evals.py"

[tasks.ci]
description = "Run the complete mobile-first skill quality gate"
run = [
  "mise run test",
  "mise run validate",
  "mise run evals",
]
