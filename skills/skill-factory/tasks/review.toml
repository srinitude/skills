Include the exact relevant files and prior evidence in the request context.
A dependency pass proves its checked scope, not all skill acceptance.


## Work

Use `mise run ledger -- <request.json>` for exact source and detail views, effective facets, original relationships, incoming and outgoing traces, file impacts and finite selections.

Its [Mastra owner](../scripts/review_ledger_workflow.ts) and existing scripts own these mechanics.

Detail views keep parent, group, document, file and inherited-owner relationship context.

They do not change endpoints or assert that a child is true.

Enumerate candidates lazily, in order, within bounds, with resume support.

Give exact counts and state omissions or sampling.

Vocabulary, representation, evidence and tests actually run are distinct.

Enumeration cannot make a claim true.

Work at the existing record owner.

Record real actions and judgments.

Then check bindings, applicability, conditions, dependents, proof and recovery.

Read the full workflow output. Use the model's own tools and judgment.
Code checks facts that can be tested; required human work stays with its owner.
Do not run this task or its dependents from inside this work unit.
Missing inputs or proof keep the affected result pending.
Correct the input or obtain the required proof before retrying.

## Proof

Return reasons, source locations, actual evidence and remaining limits.
Keep the reply bound to this task and its exact inputs.
Resume this same task through Mise using the `rule:context` reply contract.
A workflow pass checks bindings; it cannot prove meaning or human acceptance.
'''
env = { UV_PYTHON = "{{tools.python.path}}" }
depends = ["rule:ledger-relationships"]
run = "node scripts/run_rule.ts rule:ledger-traverse"

