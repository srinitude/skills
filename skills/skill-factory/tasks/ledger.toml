["rule:ledger-relationships"]
description = '''
# `rule:ledger-relationships`

## Why this runs

Preserve each relationship and its exact meaning.

## When to run

Before defining, changing, traversing or relying on a relationship.
This rule binds this factory and every skill it creates or updates.

## Inputs

Read [SKILL.md](../SKILL.md), the current request and the sources named below.
Use the same bound request and private state as `rule:context`.
Include the exact relevant files and prior evidence in the request context.
A dependency pass proves its checked scope, not all skill acceptance.


## Work

Relationships have stable IDs, typed directed endpoints and conditions.

Keep their source basis, roles, grouping and order.

Keep repeated occurrences, multiplicity, reviewer and evidence state.

Retain candidates, rejections and stale reviews.

Before using a new relationship type, ground it in a source and add it at the definition owner.

A changed definition requires review of affected occurrences and owners of generated relations.

Changed inherited meaning makes dependent proof stale, unless an explicit unchanged override preserves its effective meaning.

An absent edge does not prove independence.

A reachable node does not prove unconditional truth, transitivity or runtime readiness.

| Relationship family | Distinctions the ledger and every traversal preserve |
| --- | --- |
| Source and meaning | `part-of`, `contextualizes`, `defines`, `references`, `equivalent-under`, `distinct-from`, `refines`, `example-of`, `qualifies`, `excepts`, `contradicts`, `supersedes`, `preserves`. Preserve the exact parent, scope and authorized exception; similar words do not prove equivalence. |
| Logic and purpose | `requires-all`, `requires-alternative`, `requires-exclusive-choice`, `conditional-on`, `forbids`, `permits`, `must-be-absent`, `motivates`, `advances`, `prevents`, `protects`, `tradeoff-with`, `reinforces`, `interacts-with`. A preferred route is not a prerequisite; neither a tradeoff nor an example waives a mandatory rule. |
| Order and availability | `read-before`, `executes-before`, `gates-effect`, `gates-acceptance`, `remains-available`, `exclusive-access`, `feedback-to`, `parallel-with`. Keep reading/design, executable scheduling, protected effects and acceptance separate; preserve native conditions and versioned feedback. |
| Owners and effects | `definition-owned-by`, `execution-owned-by`, `authorized-by`, `state-owned-by`, `accepted-by`, `maintained-by`, `reads`, `writes`, `consumes`, `produces`, `hands-off-to`, `bound-to`. Required responsibility and observed performance are different claims. |
| Proof and revision | `proves`, `falsifies`, `calibrates`, `invalidates`, `recovers`, `restores`, `tests`, `compares-with`. Evidence establishes its particular claim under its conditions; a test's existence or a supplied verdict is not proof. |
| Body and distribution | `generates`, `copies-from`, `adapts`, `independent-variant-of`, `refreshes`, `body-represents`, `change-reviews-body`, `initially-loads`, `conditionally-loads`, `delivers`. The source body represents its target subjects' core contract and routes detail. Matching copies can both be stale. |
| Concepts and composition | `alias-of`, `broader-than`, `narrower-than`, `related-concept`, `identical-to`, `approximately-corresponds`, `causally-influences`, `higher-order-interaction`, `selected-from`. Separate taxonomy, exact/approximate identity, causal influence, workflow order and evidence. A pairwise projection cannot replace a joint interaction. |

Read the full workflow output. Use the model's own tools and judgment.
Code checks facts that can be tested; required human work stays with its owner.
Do not run this task or its dependents from inside this work unit.
Missing inputs or proof keep the affected result pending.
Correct the input or obtain the required proof before retrying.

## Proof

Return reasons, source locations, actual evidence and remaining limits.
Keep the reply bound to this task and its exact inputs.
Resume this same task through Mise using the `rule:context` reply contract.
A workflow pass checks bindings; it cannot prove meaning or human acceptance.
'''
env = { UV_PYTHON = "{{tools.python.path}}" }
depends = ["rule:ledger-capture"]
run = "node scripts/run_rule.ts rule:ledger-relationships"
