# `rule:work-owners`

## Why this runs

Assign tools, workflows, code and judgment to their owners.

## When to run

Before assigning, starting or resuming skill work.
This rule binds this factory and every skill it creates or updates.

## Inputs

Read [SKILL.md](../SKILL.md), the current request and the sources named below.
Use the same bound request and private state as `rule:context`.
Include the exact relevant files and prior evidence in the request context.
A dependency pass proves its checked scope, not all skill acceptance.


## Work

- **Work owners.** [Mise](https://mise.jdx.dev/) owns public commands, pinned environments and outer prerequisites.

Always start or resume [Mastra](https://mastra.ai/docs/workflows/overview) workflows through their declared [Mise](https://mise.jdx.dev/) tasks.

Do not call workflow launchers directly. [Mastra](https://mastra.ai/docs/workflows/overview) owns substantive domain control, state and recovery.

Existing tested scripts perform repeatable leaves.

Run every script, including files in the scripts directory, through its declared task (`mise run <task>`) with its real prerequisites.

Pass every skill file, including evals, examples and references, as input to a named task for its required use or checks.

Do not turn model-owned work into pretend code checks.

The model owns all work it does best, including creative choices, meaning and direct perception with its available tools.

Required human judgment stays with its human owner.

Read the full workflow output. Use the model's own tools and judgment.
Code checks facts that can be tested; required human work stays with its owner.
Do not run this task or its dependents from inside this work unit.
Missing inputs or proof keep the affected result pending.
Correct the input or obtain the required proof before retrying.

## Proof

Return reasons, source locations, actual evidence and remaining limits.
Keep the reply bound to this task and its exact inputs.
Resume this same task through Mise using the `rule:context` reply contract.
A workflow pass checks bindings; it cannot prove meaning or human acceptance.
'''
env = { UV_PYTHON = "{{tools.python.path}}" }
depends = ["rule:context"]
run = "node scripts/run_rule.ts rule:work-owners"

