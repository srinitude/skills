["rule:graph-map"]
description = '''
# `rule:graph-map`

## Why this runs

Map every rule to its real file owners.

## When to run

Before creating or checking graph records.
This rule binds this factory and every skill it creates or updates.

## Inputs

Read [SKILL.md](../SKILL.md), the current request and the sources named below.
Use the same bound request and private state as `rule:context`.
Include the exact relevant files and prior evidence in the request context.
A dependency pass proves its checked scope, not all skill acceptance.


## Work

- **Map rules to files.** The ledger owns the canonical file graph. [Mermaid](https://mermaid.js.org/) renders the same stable file and relationship IDs.

Each node is one real file.

Keep richer non-file and multi-endpoint relations in the ledger; map them exactly to file incidences in the graph.

Do not invent nodes for rules or proof.

Sort only collections whose order has no meaning.

Keep meaningful endpoint order and repeats.

Reject unknown endpoints, ID clashes, stale inventories and silent gaps.

Bind every source rule to its body clause, implementation files, real consumer/output, required proof and current disposition.

Check both directions.

Unmapped rules, unsupported non-use and missing or failed proof stay open.

No file or rule may leave completion accounting.

Read the full workflow output. Use the model's own tools and judgment.
Code checks facts that can be tested; required human work stays with its owner.
Do not run this task or its dependents from inside this work unit.
Missing inputs or proof keep the affected result pending.
Correct the input or obtain the required proof before retrying.

## Proof

Return reasons, source locations, actual evidence and remaining limits.
Keep the reply bound to this task and its exact inputs.
Resume this same task through Mise using the `rule:context` reply contract.
A workflow pass checks bindings; it cannot prove meaning or human acceptance.
'''
env = { UV_PYTHON = "{{tools.python.path}}" }
depends = ["rule:ledger-relationships"]
run = "node scripts/run_rule.ts rule:graph-map"

