# `rule:ledger-traverse`

## Why this runs

Read the right context and preserve traversal limits.

## When to run

Before using ledger views or selecting work from them.
This rule binds this factory and every skill it creates or updates.

## Inputs

Read [SKILL.md](../SKILL.md), the current request and the sources named below.
