["rule:useful-output"]
description = '''
# `rule:useful-output`

## Why this runs

Finish the producer work and test its real usefulness.

## When to run

Before designing or delivering work for a recipient.
This rule binds this factory and every skill it creates or updates.

## Inputs

Read [SKILL.md](../SKILL.md), the current request and the sources named below.
Use the same bound request and private state as `rule:context`.
Include the exact relevant files and prior evidence in the request context.
A dependency pass proves its checked scope, not all skill acceptance.


## Work

- Prevent WorkSlop: output that fails its task or leaves the recipient to finish its reasoning, checks or repair.

Find the real need.

Finish the producer's work, verify its claims and make the result usable.

Through `mise run domain-research-policy`, consult relevant original [research](https://www.betterup.com/workslop), [preprint](https://doi.org/10.31234/osf.io/5f78h_v1) and [survey](https://zapier.com/blog/ai-workslop/).

Keep their methods, populations, context and uncertainty.

Consider real working conditions, culture, agency and meaningful purpose.

Adoption and attractive presentation do not prove useful or causal improvement.

Neither do subjective satisfaction or commercial associations.

Review [Case for Conditions](https://www.betterup.com/the-case-for-conditions) and [workplace-culture findings](https://www.betterup.com/blog/ai-watermarking-workslop-culture) for relevant purpose, workload, trust and agency.

Keep self-reports, associations, preprints, commercial advice and causation distinct.

Do not combine separate samples or call estimated costs measured losses.

Seek contrary proof and newer findings.

Reward useful outcomes and honest correction.

Make flawed inputs and uncertainty easy to report.

Keep meaningful human control.

Read the full workflow output. Use the model's own tools and judgment.
Code checks facts that can be tested; required human work stays with its owner.
Do not run this task or its dependents from inside this work unit.
Missing inputs or proof keep the affected result pending.
Correct the input or obtain the required proof before retrying.

