["rule:purpose"]
description = '''
# `rule:purpose`

## Why this runs

Protect the reasons, allowed choices and intended result.

## When to run

On load and before deciding how a rule serves the skill.
This rule binds this factory and every skill it creates or updates.

## Inputs

Read [SKILL.md](../SKILL.md), the current request and the sources named below.
Use the same bound request and private state as `rule:context`.
Include the exact relevant files and prior evidence in the request context.
A dependency pass proves its checked scope, not all skill acceptance.


## Work

Turn intent into skills that can be used.

Make its reasons, actions and proof open to review.

For each rule that matters, state the outcome it protects and the failure it prevents.

Keep valid alternatives.

Keep uncertainty, intelligence, creativity, craft and taste.

A part can be sound in a technical sense and still fail its task.

Use `rule:simplicity`, `rule:methods` and `rule:useful-output`, routed from [Motivation](../SKILL.md#motivation).

Read the full workflow output. Use the model's own tools and judgment.
Code checks facts that can be tested; required human work stays with its owner.
Do not run this task or its dependents from inside this work unit.
Missing inputs or proof keep the affected result pending.
Correct the input or obtain the required proof before retrying.

## Proof

Return reasons, source locations, actual evidence and remaining limits.
Keep the reply bound to this task and its exact inputs.
Resume this same task through Mise using the `rule:context` reply contract.
A workflow pass checks bindings; it cannot prove meaning or human acceptance.
'''
env = { UV_PYTHON = "{{tools.python.path}}" }
depends = ["rule:outcome"]
run = "node scripts/run_rule.ts rule:purpose"

