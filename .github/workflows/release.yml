name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Verify and publish GitHub release
        run: mise run release-github
        env:
          GH_TOKEN: ${{ github.token }}
