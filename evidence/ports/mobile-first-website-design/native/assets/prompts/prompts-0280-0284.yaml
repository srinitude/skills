ge Direction versioned image family, mapping table, and exception log. The observable outcome is:\n\nadapt an approved visual system into controlled variants for translate an open visual ambition into a controllable art direction, reference strategy, and generation brief, viewed from the team and systems moving assets from source through delivery.\n\nDefine completion in terms of inspectable artifacts and retained evidence, not activity, tool invocation, aesthetic confidence, or a self-authored score. The quality focus is concept coherence, visual authorship, reference traceability, and controllable variation; handoffs, versioning, automation, dependencies, and recoverable execution. Separate the user's intended result from any proposed style, model, application, file layout, or generation recipe. Treat those implementation choices as replaceable unless the user, an authoritative specification, or reproducibility requirement fixes them.\n\n## 3. Inputs\n\nResolve and validate these inputs before consequential execution:\n\n- the visual brief, intended audience or operator, use context, and required deliverables;\n- supplied images, masks, layers, vectors, frames, data, copy, geometry, or approved masters;\n- target sizes, aspect ratios, color spaces, formats, platform states, print constraints, and naming rules;\n- protected invariants such as identity, product facts, layout geometry, source pixels, wording, data values, brand elements, and approved claims;\n- available tool and MCP configuration, execution budget, output location, and overwrite policy;\n- source, license, consent, disclosure, and provenance records relevant to the assets;\n- approval boundaries for paid calls, shared-file edits, publishing, destructive changes, or external account actions;\n- the timezone needed to interpret relative dates.\n\nAt least one source, reference, prior rendition, screenshot, or explicitly empty source set must be accounted for. Do not substitute a guessed image, common industry default, invented brand rule, or remembered external contract for a missing authoritative input. If a missing fact changes the work materially, produce the reversible portion and ask one concise gating question.\n\n## 4. Current-date handling\n\nRecalculate today's date at runtime from a fresh clock anchor in the applicable timezone. Never reuse the conversation start date, repository generation date, a model knowledge date, file modification time, or a date retained from an earlier run as if it were current.\n\nResolve relative date language before making a date-sensitive tool call. Record the exact date, timezone, UTC offset, and clock source in the evidence ledger when currency, rights windows, campaign timing, source validity, or release timing matters. If the clock or timezone cannot be verified, report `temporal-anchor-unavailable` and stop date-dependent work instead of guessing.\n\n## 5. Working method\n\nUse this stage-specific method: identify protected visual invariants, generate and edit each required variant, then compare the family for fidelity, legibility, and local exceptions.\n\nBefore acting, write a compact private outcome map covering outcome, proof, fixed constraints, the requested starting path, and unknowns. Classify instructions as outcome invariants, evidence obligations, boundaries, forbidden outcomes, mandatory methods, candidate paths, or unresolved items. Preserve every invariant and evidence obligation when adapting a candidate path.\n\nPlan the smallest complete sequence that can produce the outcome. Validate inputs before execution. Preserve originals and use new outputs or versioned copies by default. After every material visual operation, inspect the actual pixels or rendered state rather than trusting a success response. Compare outputs against the brief, protected invariants, and source artifacts. Record defects and revise only when the evidence identifies a resolvable problem.\n\nDo not silently widen scope. Do not run p