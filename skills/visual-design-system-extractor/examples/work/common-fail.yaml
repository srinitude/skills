# Smallest document that clears every gate, and the shape reference for one
# filled token of each kind. Its meta block and key order match
# assets/schema-skeleton.yaml. Sections with no evidence use the collapsed
# not-applicable object, which is legal; examples/failure-section-order.md
# shows the expanded form that keeps a section's own keys.
# Verified on 2026-07-25 from the skill root:
#   uv run --no-project --with 'PyYAML>=6,<7' python \
#     scripts/validate_design_system_yaml.py assets/minimal-extraction.yaml
#   -> {"confidence_markers": 62, "errors": [], "font_entries": 3,
#       "live_fonts_checked": true, "rarity_floor": 70.0, "valid": true,
#       "viability_recorded": true}  exit 0
# Rerun it after any font rule change: recorded ranks drift with the live feed.
meta:
  schema_version: '1.0'
  extraction_mode: 'comprehensive_visual_design_system'
  source_count: 1
  source_types:
    - 'screenshot'
  generated_for: 'ui_ux_brand_motion_creative_direction'
  rarity_floor: 70.0
  extracted_at: '2026-07-25'
  validation:
    yaml_only: true
    parser_validated: true
    markdown_fences: false
  viability:
    rendered_file: 'examples/work/pass2.html'
    screenshot_file: 'examples/work/pass2.png'
    iterations: 2
    verdict: pass
    criteria:
      - criterion: legibility
        verdict: pass
        observed: 'Body copy sets at 17px in Epunda Slab with open counters and no fallback face; the smallest text on the page, nav, table headers, and footer, holds at 16px, which is the floor the accessibility note states.'
      - criterion: contrast
        verdict: pass
        observed: 'Ink 141210 on paper f6f2ea measures about 15.6 to 1 for body copy, and the filled button inverts the same pair.'
      - criterion: hierarchy
        verdict: pass
        observed: 'The steps 64, 40, 28, 22, 17, and 16 are each visibly apart in the screenshot, and heading level four now sits above body copy instead of below it.'
      - criterion: font_pairing
        verdict: pass
        observed: 'Ramsina in the headline and Epunda Slab in the body share a serif skeleton but differ in leading, 1.05 against 1.55, and in stroke weight, so the two roles never read as one face.'
      - criterion: spacing_rhythm
        verdict: pass
        observed: 'The 16px base drives 32, 64, and 96 steps, and the gaps between header, hero, sections, cards, and footer step evenly down the page.'
      - criterion: color_harmony
        verdict: pass
        observed: 'Two warm values carry the whole page, paper for surface and ink for text, rules, and the filled button, so roles stay separate without a third hue.'
      - criterion: state_distinction
        verdict: pass
        observed: 'Filled, outlined, and disabled buttons are distinct in the screenshot, and the focus ring is a 3px accent outline offset from the control. Hover cannot appear in a still capture, so it was read in the stylesheet.'
      - criterion: reference_fidelity
        verdict: pass
        observed: 'The headline keeps the wedge terminals and the thick to thin transition seen in the poster crop at 64px, and the page reads as the same editorial voice.'
source_analysis:
  observed:
    - 'One editorial poster crop with a high contrast serif headline.'
  inferred:
    - 'A two family system with a serif display voice and a quieter text face.'
  speculative:
    - 'Motion behaviour is not visible in a still reference.'
  source_inventory:
    images:
      - 'poster-crop.png'
    visible_text:
      - 'Headline set in a high contrast serif.'
    visible_interfaces: []
    visible_people_or_characters: []
    visible_environments: []
    visible_brand_marks: []
  evidence_boundaries:
    directly_observed:
      - 'Letterform contrast and headline scale.'
    inferred_from_visual_cues:
      - 'Text face pairing derived from the caption weight.'
    low_confidence_extrapolations:
      - 'Interface behaviour beyond the crop.'
