# Synthetic invalid input for one validator contract: a failing visual criterion blocks completion.
meta:
  schema_version: '1.0'
  extraction_mode: comprehensive_visual_design_system
  source_count: 1
  source_types:
  - screenshot
  generated_for: ui_ux_brand_motion_creative_direction
  rarity_floor: 70.0
  extracted_at: '2026-07-25'
  validation:
    yaml_only: true
    parser_validated: true
    markdown_fences: false
  viability:
    rendered_file: examples/work/no-viability.html
    screenshot_file: examples/work/no-viability.png
    iterations: 1
    verdict: fail
    criteria:
    - criterion: legibility
      verdict: fail
      observed: Synthetic failing observation for the negative viability fixture.
    - criterion: contrast
      verdict: pass
      observed: Near-black type and rules remain clear on the warm cream canvas. The filled primary button, outlined secondary button, disabled gray button, and token swatches are visibly separated without low-contrast text.
    - criterion: hierarchy
      verdict: pass
      observed: The 64px hero, descending heading levels, body copy, labels, tables, cards, code sample, and token inventory form an unambiguous visual order. Scale and whitespace separate sections without competing focal points.
    - criterion: font_pairing
      verdict: pass
      observed: Wittgenstein supplies expressive high-contrast display forms while Parastoo supplies calmer reading text. Their roles are applied consistently and the two serif textures remain distinguishable without visual conflict.
    - criterion: spacing_rhythm
      verdict: pass
      observed: The page keeps stable outer margins and left edges, even button and card padding, consistent table rows, and larger section breaks. No crowding, collision, or broken alignment is visible.
    - criterion: color_harmony
      verdict: pass
      observed: Warm cream, near-black, pale cool-gray rules, and neutral disabled gray form a coherent restrained palette. The visible swatches agree with the rendered page and no clashing hue appears.
    - criterion: state_distinction
      verdict: pass
      observed: The static specimen clearly distinguishes a dark filled primary action, a light outlined secondary action, and a gray disabled action. Hover and focus states are not shown and are not inferred.
    - criterion: reference_fidelity
      verdict: pass
      observed: The updated display face reads as a clean high-contrast editorial serif with crisp terminals and controlled proportions. The prior charted, jagged, pixel-like treatment is absent throughout the hero, headings, cards, table headers, and token samples.
source_analysis:
  observed:
  - One editorial poster crop with a high contrast serif headline.
  inferred:
  - A two family system with a serif display voice and a quieter text face.
  speculative:
  - Motion behaviour is not visible in a still reference.
  source_inventory:
    images:
    - poster-crop.png
    visible_text:
