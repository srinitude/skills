["rule:markdown-order"]
description = '''
# `rule:markdown-order`

## Why this runs

Review whole files before blocks and lines.

## When to run

Before reviewing or rewriting any Markdown file.
This rule binds this factory and every skill it creates or updates.

## Inputs

Read [SKILL.md](../SKILL.md), the current request and the sources named below.
Use the same bound request and private state as `rule:context`.
Include the exact relevant files and prior evidence in the request context.
A dependency pass proves its checked scope, not all skill acceptance.


## Work

- Review the whole file first: its purpose, reader, required rules, structure, order and fit with the skill.

Next review its sections and blocks.

Polish lines last.

Judge Markdown forms, spacing and plain language together.

Then read the full result again.

Use `mise run markdown:inventory`, `markdown:mechanical`, `markdown:review-request`, `markdown:macro-review`, `markdown:micro-review`, `markdown:line-review`, `markdown:review-check`, then `markdown:accept`.

Run each through `mise run`; each task names its real prerequisite.

Load the [writing rules](../references/writing-rules.md) for this review.

Within this skill, check each sentence, rule, section, file and cross-file relationship for kept meaning and alternate readings.

The [rewrite method](https://github.com/srinitude/skills/blob/main/skills/meaning-preserving-rewrite/SKILL.md) and [ambiguity method](https://github.com/srinitude/skills/blob/main/skills/only-one-interpretation/SKILL.md) are sources, not required installed skills.

Map source clauses to replacements and back.

Test alternate readings, conflicts and exceptions.

Human same-meaning review checks clarity and completeness.

Lexical lint cannot replace it.

Read the full workflow output. Use the model's own tools and judgment.
Code checks facts that can be tested; required human work stays with its owner.
Do not run this task or its dependents from inside this work unit.
Missing inputs or proof keep the affected result pending.
Correct the input or obtain the required proof before retrying.

## Proof

Return reasons, source locations, actual evidence and remaining limits.
Keep the reply bound to this task and its exact inputs.
Resume this same task through Mise using the `rule:context` reply contract.
A workflow pass checks bindings; it cannot prove meaning or human acceptance.
'''
env = { UV_PYTHON = "{{tools.python.path}}" }
depends = ["rule:context"]
run = "node scripts/run_rule.ts rule:markdown-order"

